[pytest]
# tests/demo_scenarios.py does not match pytest's default test_*.py pattern, so
# it would be silently skipped -- the worst outcome for a file whose job is to
# prove the demo scenarios still hold. Named explicitly rather than renamed.
python_files = test_*.py *_test.py demo_scenarios.py

markers =
    slow: calls the optimizer and prediction models; set RUN_SLOW=1 to include
